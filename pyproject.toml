[project]
name = "epmkit"
version = "0.1.0"
description = "Unofficial Python SDK for Oracle EPM Cloud REST APIs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
cli = ["typer>=0.12"]

[project.scripts]
epmkit = "epmkit.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29", "pandas>=2.0", "typer>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
